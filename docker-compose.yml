version: '3.8'

services:
  aio-subtitles:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aio-subtitles
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - BASE_URL=http://localhost:7000
      # Optional: set default API keys so users don't need their own
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}
      - CACHE_TTL_MINUTES=30
      - RATE_LIMIT_MAX=150
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
